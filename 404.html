<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Vibe Hero</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1d1f23; --mute:#7b818b; --accent:#2f6fbd; --line:#e3e3dd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15171b; --fg:#e6e7ea; --mute:#868c96; --accent:#6ea8f0; --line:#2b3038; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif; padding:16px; }
  main { text-align:center; max-width:520px; }
  h1 { font-size:3rem; margin:0 0 .2em; }
  p { color:var(--mute); line-height:1.7; }
  a { display:inline-block; margin:8px; padding:8px 16px; border:1px solid var(--line); border-radius:8px; color:var(--accent); text-decoration:none; }
  a:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>页面不存在。<br><span lang="en">This page doesn't exist.</span></p>
  <a id="zh" href="zh/index.html">返回中文首页</a>
  <a id="en" href="en/index.html" lang="en">English home</a>
</main>
<script>
  // Works whether the site is served from a domain root or a sub-path (e.g. GitHub Pages project sites)
  var base = location.pathname.replace(/\/(zh|en)\/.*$/, '/').replace(/[^/]*$/, '');
  document.getElementById('zh').href = base + 'zh/index.html';
  document.getElementById('en').href = base + 'en/index.html';
</script>
</body>
</html>
